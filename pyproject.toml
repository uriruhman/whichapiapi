[project]
name = "whichapiapi"
version = "0.5.0"
description = "Pick the right API for your automation: tested on your tasks, priced for your load."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "openai>=1.60",
    "typer>=0.12",
    "rich>=13.9",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "jsonschema>=4.23",
    "fastmcp>=2.12",
    "jiwer>=3.0",
    "tinytag>=2.3.2",
    "pyarrow>=25.0.1",
    "regex>=2026.9.29",
    "more-itertools>=11.1.0",
    "tiktoken>=0.14.0",
    "tokenizers>=0.23.2",
    "cryptography>=50.0.1",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.3"]

[project.scripts]
whichapiapi = "whichapiapi.surfaces.cli:main"

[project.entry-points."whichapiapi.adapters"]
models_dev = "whichapiapi.adapters.models_dev:ModelsDevAdapter"
newapi = "whichapiapi.adapters.newapi:NewApiAdapter"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whichapiapi"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["src/whichapiapi/evaluator/whisper_normalizers"]  # vendored, kept byte-identical to upstream

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"src/whichapiapi/surfaces/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
