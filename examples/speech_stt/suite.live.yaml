# REAL speech.stt run: OpenAI transcription models relayed by a reseller (new-api), OpenAI-compatible
# /audio/transcriptions. Audio + reference transcripts are third-party (LibriSpeech, FLEURS; CC BY 4.0) and live in
# the git-ignored .cache/ — build them first:
#   uv run python examples/speech_stt/build_cases.py --en 5 --ru 3      # 8 clips, ~95 s of audio
#   set -a; . ~/.config/whichapiapi/env; set +a; export WHICHAPIAPI_BUDGET_TOTAL=1.5   # keys in env, never in the repo
#   uv run whichapiapi eval run examples/speech_stt/suite.live.yaml -y --no-judge
# List prices are OpenAI's per-minute estimates (developers.openai.com/api/docs/pricing, 2026-09-29); whisper-1 is no
# longer on that page, its last list price was $0.006/min. Real cost comes from the a reseller call log.
description: "speech.stt · OpenAI transcription via a reseller vs Deepgram, normalized WER on EN+RU clips"

prompts:
  - file://prompt.json

providers:
  - id: reseller:gpt-4o-mini-transcribe
    label: gpt-4o-mini-transcribe
    x-whichapiapi: {current: true, price: {per_unit: 0.003, unit: minute}}
  - id: reseller:gpt-4o-transcribe
    label: gpt-4o-transcribe
    x-whichapiapi: {price: {per_unit: 0.006, unit: minute}}
  - id: reseller:whisper-1
    label: whisper-1
    x-whichapiapi: {price: {per_unit: 0.006, unit: minute}}
  # Deepgram (needs DEEPGRAM_API_KEY; $200 signup credit, no card). Pay-as-you-go list price, deepgram.com/pricing.
  - id: deepgram:nova-3
    label: deepgram-nova-3
    x-whichapiapi: {price: {per_unit: 0.0043, unit: minute}}
  # Groq (OpenAI-compatible, needs GROQ_API_KEY; ~10 s minimum billed per request):
  # - id: groq:whisper-large-v3-turbo
  #   label: groq-whisper-turbo
  #   x-whichapiapi: {price: {per_unit: 0.000667, unit: minute}}   # $0.04/hour

defaultTest:
  assert:
    - {type: wer, value: "{{reference}}", threshold: 0.25, metric: wer}

tests: file://.cache/tests.live.yaml

x-whichapiapi:
  capability: speech.stt
  contains_pii: false
  budget: {run_usd: 0.10, default_units_per_call: 0.5}
  min_pass_rate: 0.5
  channels:
    reseller:
      base_url: https://api.reseller.example/v1
      key_env: RESELLER_API_KEY
      protocol: openai_stt
      balance: newapi
      min_balance: 0.30 # the key is shared with the live channel — never drain it
      timeout_s: 120
    deepgram:
      base_url: https://api.deepgram.com/v1
      key_env: DEEPGRAM_API_KEY
      protocol: deepgram
      timeout_s: 120
    groq:
      base_url: https://api.groq.com/openai/v1
      key_env: GROQ_API_KEY
      protocol: openai_stt
      timeout_s: 120
